<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="manifest" href="/manifest.webmanifest"><meta name="theme-color" content="#193e2e"><title>PaddyGuard | My field</title><link rel="stylesheet" href="style.css">
<header><strong>PaddyGuard</strong><label>Language <select id="lang"><option value="en-LK">English</option><option value="ta-LK">தமிழ்</option><option value="si-LK">සිංහල</option></select></label></header>
<main><section><h1>My paddy field</h1><form id="field"><label for="area">Where is your field?</label><div class="row"><select id="area" required></select><button>Confirm field</button></div></form>
<p id="profile"></p><button type="button" id="reset" hidden>Start new season</button>
<h2>Field conversation</h2><div id="history" aria-live="polite"></div>
<form id="chat"><label for="message">Ask about field conditions</label><textarea id="message" maxlength="2000" rows="3" placeholder="My field is rainfed. Can I spray tomorrow morning?"></textarea>
<label for="window">Check the next 12 hours starting</label><select id="window"><option value="tomorrow">Tomorrow at 6 am</option><option value="now">This hour</option></select>
<label for="photo">Attach a leaf or pest photo</label>
<input type="file" accept="image/*" id="photo"><figure id="attachment" hidden><img id="preview" alt="Selected crop photo" width="160"><button type="button" id="remove">Remove photo</button></figure>
<p class="hint">Dictation may send audio to a cloud speech service. Review the transcript before sending. Attached photos are sent for analysis when you press Send.</p>
<div class="row"><button type="button" id="dictate">Dictate</button><button id="send" disabled>Send</button></div></form><p role="status" id="status"></p></section>
<aside><h2>Decision record</h2><ol id="trace"></ol></aside></main>
<script type="module" src="app.js"></script></html>
